<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arian's News Agent</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e0e0e0; min-height: 100vh; }
  header { background: #1a1d2e; border-bottom: 1px solid #2d2f45; padding: 18px 30px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 1.3rem; font-weight: 700; color: #fff; }
  header span { font-size: 0.8rem; color: #888; margin-left: auto; }
  .config { background: #1a1d2e; border: 1px solid #2d2f45; border-radius: 10px; padding: 20px; margin: 24px 30px 0; }
  .config h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: #888; margin-bottom: 14px; }
  .config-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .config-row label { font-size: 0.8rem; color: #aaa; display: block; margin-bottom: 5px; }
  .config-row input[type=password], .config-row input[type=text] { background: #0f1117; border: 1px solid #3a3d55; border-radius: 6px; padding: 9px 13px; color: #e0e0e0; font-size: 0.9rem; width: 280px; }
  .config-row input:focus { outline: none; border-color: #6c7bff; }
  .topic-mode { display: flex; gap: 8px; margin-bottom: 10px; }
  .mode-btn { background: #0f1117; border: 1px solid #3a3d55; color: #aaa; border-radius: 6px; padding: 6px 14px; font-size: 0.82rem; cursor: pointer; transition: all 0.2s; }
  .mode-btn.active { border-color: #6c7bff; color: #6c7bff; background: #1a1d2e; }
  .topics-check { display: flex; gap: 10px; flex-wrap: wrap; }
  .topics-check label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 0.88rem; background: #0f1117; border: 1px solid #3a3d55; border-radius: 6px; padding: 7px 13px; transition: border-color 0.2s; }
  .topics-check label:has(input:checked) { border-color: #6c7bff; }
  .topics-check input[type=checkbox] { accent-color: #6c7bff; }
  .custom-input { display: flex; gap: 8px; align-items: center; }
  .custom-input input { width: 260px; }
  .custom-hint { font-size: 0.75rem; color: #555; margin-top: 4px; }
  .run-btn { background: #6c7bff; color: #fff; border: none; border-radius: 8px; padding: 10px 26px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.2s; white-space: nowrap; }
  .run-btn:hover { background: #8491ff; }
  .run-btn:disabled { background: #3a3d55; color: #666; cursor: not-allowed; }
  .status { margin: 16px 30px 0; font-size: 0.85rem; color: #888; min-height: 20px; }
  .status.error { color: #ff6b6b; }
  .status.ok { color: #6bffb8; }
  #report { margin: 20px 30px 30px; }
  .badge { font-size: 0.72rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px; display: inline-block; }
  .badge.CNN { background: #cc0000; color: #fff; }
  .badge.Fox { background: #003366; color: #fff; }
  .badge.Guardian { background: #005689; color: #fff; }
  .section-title { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 1px; color: #6c7bff; margin: 28px 0 12px; border-bottom: 1px solid #2d2f45; padding-bottom: 6px; }
  .cluster { background: #1a1d2e; border: 1px solid #2d2f45; border-radius: 10px; padding: 18px; margin-bottom: 14px; }
  .cluster-topic { font-size: 1rem; font-weight: 700; color: #fff; margin-bottom: 10px; }
  .source-block { margin-bottom: 14px; }
  .source-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .source-label.CNN { color: #ff6b6b; }
  .source-label.Fox { color: #6b9fff; }
  .source-label.Guardian { color: #6bffb8; }
  .article { border-left: 2px solid #3a3d55; padding: 8px 12px; margin-bottom: 6px; }
  .article-title { font-size: 0.88rem; color: #ddd; line-height: 1.4; }
  .article-title a { color: inherit; text-decoration: none; }
  .article-title a:hover { text-decoration: underline; color: #6c7bff; }
  .article-desc { font-size: 0.8rem; color: #888; margin-top: 4px; line-height: 1.4; }
  .dl-row { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
  .dl-btn { background: #1a1d2e; border: 1px solid #3a3d55; color: #e0e0e0; border-radius: 8px; padding: 9px 20px; font-size: 0.88rem; cursor: pointer; transition: border-color 0.2s; }
  .dl-btn:hover { border-color: #6c7bff; color: #6c7bff; }
  .loader { display: inline-block; width: 14px; height: 14px; border: 2px solid #3a3d55; border-top-color: #6c7bff; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { color: #555; font-size: 0.88rem; text-align: center; padding: 40px; }
  .source-section { margin-bottom: 20px; }
</style>
</head>
<body>

<header>
  <span>🗞️</span>
  <h1>Arian's News Agent</h1>
  <span>CNN · Fox News · The Guardian</span>
</header>

<div class="config">
  <h2>Configuration</h2>
  <div class="config-row">
    <div>
      <label>NewsAPI Key <a href="https://newsapi.org/register" target="_blank" style="color:#6c7bff;font-size:0.75rem;">(get free key)</a></label>
      <input type="password" id="apiKey" placeholder="Paste your NewsAPI key here" />
    </div>
    <div>
      <label>Topic</label>
      <div class="topic-mode">
        <button class="mode-btn active" id="modePreset" onclick="switchMode('preset')">Preset</button>
        <button class="mode-btn" id="modeCustom" onclick="switchMode('custom')">Custom keyword</button>
      </div>
      <div id="presetPanel" class="topics-check">
        <label><input type="checkbox" id="topicBusiness" checked><span>Business</span></label>
        <label><input type="checkbox" id="topicSports"><span>Sports</span></label>
        <label><input type="checkbox" id="topicTechnology"><span>Technology</span></label>
        <label><input type="checkbox" id="topicPolitics"><span>Politics</span></label>
      </div>
      <div id="customPanel" style="display:none">
        <div class="custom-input">
          <input type="text" id="customTopic" placeholder="e.g. travel ban, AI, inflation" />
        </div>
        <div class="custom-hint">Type any keyword — the agent will search all 3 sources for it.</div>
      </div>
    </div>
        <div>
      <label>Date Range</label>
      <div style="display:flex;gap:8px;align-items:center">
        <input type="date" id="dateFrom" style="width:150px;background:#0f1117;border:1px solid #3a3d55;border-radius:6px;padding:9px 13px;color:#e0e0e0;font-size:0.9rem" />
        <span style="color:#888;font-size:0.85rem">to</span>
        <input type="date" id="dateTo" style="width:150px;background:#0f1117;border:1px solid #3a3d55;border-radius:6px;padding:9px 13px;color:#e0e0e0;font-size:0.9rem" />
      </div>
      <div class="custom-hint">⚠️ Date filtering requires a paid NewsAPI plan. On free plan, latest news is always returned.</div>
    </div>
      <button class="run-btn" id="runBtn" onclick="runAgent()">▶ Run Agent</button>
  </div>
</div>

<div class="status" id="status">Enter your NewsAPI key and click Run Agent.</div>
<div id="report"></div>

<script>
const PROXY = 'https://news-agent-liard.vercel.app/api/news';
const SOURCES = { CNN: 'cnn', Fox: 'fox-news', Guardian: 'the-guardian-au' };
const TOPIC_QUERIES = { Business: 'business', Sports: 'sports', Technology: 'technology', Politics: 'politics' };

let lastReportData = null;
let currentMode = 'preset';

function switchMode(mode) {
  currentMode = mode;
  document.getElementById('modePreset').classList.toggle('active', mode === 'preset');
  document.getElementById('modeCustom').classList.toggle('active', mode === 'custom');
  document.getElementById('presetPanel').style.display = mode === 'preset' ? 'flex' : 'none';
  document.getElementById('customPanel').style.display = mode === 'custom' ? 'block' : 'none';
}

function setStatus(msg, type='') {
  const el = document.getElementById('status');
  el.className = 'status ' + type;
  el.innerHTML = msg;
}

function getQuery() {
  if (currentMode === 'custom') {
    return document.getElementById('customTopic').value.trim();
  }
  const selected = Object.keys(TOPIC_QUERIES).filter(t => document.getElementById('topic'+t)?.checked);
  return selected.map(t => TOPIC_QUERIES[t]).join(' OR ');
}

async function fetchSource(sourceId, q) {
  const from = document.getElementById('dateFrom').value;
  const to = document.getElementById('dateTo').value;
  let url = `${PROXY}?sources=${sourceId}`;
  if (q) url += `&q=${encodeURIComponent(q)}`;
  if (from) url += `&from=${from}`;
  if (to) url += `&to=${to}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  if (data.status !== 'ok') throw new Error(data.message || 'API error');
  return data.articles || [];
}

function extractKeywords(title) {
  const stop = new Set(['the','a','an','in','on','at','to','for','of','and','or','but','is','are','was','were','with','from','by','as','this','that','has','have','its','it','be','been','will','he','she','they','we','his','her','their','our','says','said','new','after','over','up','out','about','how','what','who','when','why','more','also','not','no','can','could','would','should','may','might','vs','than','us','amid','into','just']);
  return title.toLowerCase().replace(/[^a-z0-9 ]/g,'').split(/\s+/).filter(w => w.length > 3 && !stop.has(w));
}

function groupBySource(articles) {
  const g = {};
  articles.forEach(a => { if (!g[a.source]) g[a.source] = []; g[a.source].push(a); });
  return g;
}

async function runAgent() {
  const apiKey = document.getElementById('apiKey').value.trim();
  if (!apiKey) { setStatus('⚠️ Please enter your NewsAPI key.', 'error'); return; }
  const query = getQuery();
  if (!query) { setStatus('⚠️ Select a topic or enter a custom keyword.', 'error'); return; }

  const btn = document.getElementById('runBtn');
  btn.disabled = true;
  document.getElementById('report').innerHTML = '';
  lastReportData = null;

  const bySource = {};

  for (const [name, id] of Object.entries(SOURCES)) {
    setStatus(`<span class="loader"></span>Fetching from <b>${name}</b>...`);
    try {
      const articles = await fetchSource(id, query);
      bySource[name] = articles.map(a => ({ source: name, title: a.title, description: a.description, url: a.url }));
    } catch(e) {
      setStatus(`Error fetching ${name}: ${e.message}`, 'error');
      btn.disabled = false;
      return;
    }
  }

  setStatus(`<span class="loader"></span>Building report...`);
  await new Promise(r => setTimeout(r, 300));

  const total = Object.values(bySource).reduce((s, a) => s + a.length, 0);
  lastReportData = { bySource, query, generated: new Date().toLocaleString() };

  renderReport(lastReportData);
  setStatus(`✓ Done — ${total} articles collected across CNN, Fox News, and The Guardian.`, 'ok');
  btn.disabled = false;
}

function renderReport({ bySource, query, generated }) {
  const el = document.getElementById('report');
  const srcOrder = ['CNN', 'Fox', 'Guardian'];

  let html = `
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:20px;flex-wrap:wrap">
      ${srcOrder.map(s => `<span class="badge ${s}">${s === 'Guardian' ? 'The Guardian' : s === 'Fox' ? 'Fox News' : s}</span>`).join('')}
      <span style="margin-left:auto;font-size:0.78rem;color:#555">Topic: <b style="color:#aaa">${query}</b> &nbsp;·&nbsp; ${generated}</span>
    </div>
  `;

  // Per-source sections side by side
  html += `<div class="section-title">📰 What Each Source Says</div>`;
  html += `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:28px">`;
  srcOrder.forEach(src => {
    const arts = bySource[src] || [];
    html += `
      <div style="background:#1a1d2e;border:1px solid #2d2f45;border-radius:10px;padding:16px">
        <div class="source-label ${src}" style="margin-bottom:10px">${src === 'Guardian' ? 'The Guardian' : src === 'Fox' ? 'Fox News' : 'CNN'}</div>
        ${arts.length ? arts.slice(0,5).map(a => `
          <div class="article">
            <div class="article-title"><a href="${a.url}" target="_blank">${a.title}</a></div>
            ${a.description ? `<div class="article-desc">${a.description.slice(0,100)}…</div>` : ''}
          </div>`).join('') : '<div class="empty" style="padding:20px">No articles found</div>'}
      </div>
    `;
  });
  html += `</div>`;

  html += `
    <div class="dl-row">
      <button class="dl-btn" onclick="downloadHTML()">⬇ Download Report (HTML)</button>
      <button class="dl-btn" onclick="downloadText()">⬇ Download Report (TXT)</button>
      <button class="dl-btn" onclick="downloadDOC()">⬇ Download Report (DOC)</button>
      <button class="dl-btn" onclick="downloadPDF()">⬇ Download Report (PDF)</button>
    </div>
  `;

  el.innerHTML = html;
}

function buildDocContent() {
  if (!lastReportData) return '';
  const { bySource, query, generated } = lastReportData;
  const srcOrder = ['CNN', 'Fox', 'Guardian'];
  const srcNames = { CNN: 'CNN', Fox: 'Fox News', Guardian: 'The Guardian' };

  let doc = `
    <html><head><meta charset="UTF-8">
    <style>
      body { font-family: Calibri, Arial, sans-serif; max-width: 800px; margin: 40px auto; color: #111; line-height: 1.6; }
      h1 { font-size: 1.6rem; border-bottom: 2px solid #333; padding-bottom: 8px; }
      h2 { font-size: 1.1rem; margin-top: 30px; color: #333; }
      h3 { font-size: 1rem; margin-top: 20px; }
      .meta { color: #888; font-size: 0.85rem; margin-bottom: 20px; }
      .topic-section { margin-bottom: 30px; border: 1px solid #ddd; border-radius: 6px; padding: 16px; }
      .source-block { margin-bottom: 16px; }
      .source-name { font-weight: bold; font-size: 1rem; border-bottom: 1px solid #eee; padding-bottom: 4px; margin-bottom: 8px; }
      .source-name.cnn { color: #cc0000; }
      .source-name.fox { color: #003366; }
      .source-name.guardian { color: #005689; }
      .article-item { margin-bottom: 10px; }
      .article-item a { color: #1a0dab; }
      .article-desc { color: #555; font-size: 0.9rem; }
    </style>
    </head><body>
    <h1>📰 Arian's News Agent — Report</h1>
    <div class="meta">Topic: <strong>${query}</strong> &nbsp;|&nbsp; Generated: ${generated}</div>
    <div class="topic-section">
      <h2>Topic: "${query}"</h2>
      <p style="color:#555;font-size:0.9rem;margin-bottom:16px">Here is how each source covered this topic:</p>
  `;

  srcOrder.forEach(src => {
    const arts = bySource[src] || [];
    const cls = src === 'CNN' ? 'cnn' : src === 'Fox' ? 'fox' : 'guardian';
    doc += `<div class="source-block">`;
    doc += `<div class="source-name ${cls}">${srcNames[src]} says:</div>`;
    if (arts.length) {
      arts.slice(0, 5).forEach(a => {
        doc += `<div class="article-item">`;
        doc += `<div>• <a href="${a.url}">${a.title}</a></div>`;
        if (a.description) doc += `<div class="article-desc">${a.description.slice(0, 150)}…</div>`;
        doc += `</div>`;
      });
    } else {
      doc += `<div style="color:#aaa">No articles found for this topic.</div>`;
    }
    doc += `</div>`;
  });

  doc += `</div></body></html>`;
  return doc;
}

function buildTextReport() {
  if (!lastReportData) return '';
  const { bySource, query, generated } = lastReportData;
  const srcOrder = ['CNN', 'Fox', 'Guardian'];
  const srcNames = { CNN: 'CNN', Fox: 'Fox News', Guardian: 'The Guardian' };
  let t = `ARIAN'S NEWS AGENT REPORT\nTopic: ${query}\nGenerated: ${generated}\n${'='.repeat(60)}\n\n`;
  srcOrder.forEach(src => {
    t += `${srcNames[src]} says:\n${'-'.repeat(40)}\n`;
    (bySource[src] || []).slice(0,5).forEach(a => { t += `• ${a.title}\n  ${a.url}\n`; });
    t += '\n';
  });
  return t;
}

function downloadText() {
  triggerDownload(new Blob([buildTextReport()], {type:'text/plain'}), 'news_report.txt');
}

function downloadHTML() {
  const content = document.getElementById('report').innerHTML;
  const full = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>News Report</title>
  <style>body{font-family:Segoe UI,sans-serif;background:#0f1117;color:#e0e0e0;padding:30px}
  .badge{display:inline-block;font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;margin:2px}
  .badge.CNN{background:#cc0000;color:#fff}.badge.Fox{background:#003366;color:#fff}.badge.Guardian{background:#005689;color:#fff}
  .source-label{font-size:.75rem;font-weight:700;text-transform:uppercase}
  .source-label.CNN{color:#ff6b6b}.source-label.Fox{color:#6b9fff}.source-label.Guardian{color:#6bffb8}
  .article{border-left:2px solid #3a3d55;padding:8px 12px;margin-bottom:6px}
  a{color:#6c7bff}</style></head><body>${content}</body></html>`;
  triggerDownload(new Blob([full], {type:'text/html'}), 'news_report.html');
}

function downloadPDF() {
  const { bySource, query, generated } = lastReportData;
  const srcOrder = ['CNN', 'Fox', 'Guardian'];
  const srcNames = { CNN: 'CNN', Fox: 'Fox News', Guardian: 'The Guardian' };
  const srcColors = { CNN: '#cc0000', Fox: '#003366', Guardian: '#005689' };

  const printWin = window.open('', '_blank');
  let html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>News Report</title>
  <style>
    body { font-family: Calibri, Arial, sans-serif; max-width: 800px; margin: 40px auto; color: #111; line-height: 1.6; }
    h1 { font-size: 1.6rem; border-bottom: 2px solid #333; padding-bottom: 8px; margin-bottom: 6px; }
    .meta { color: #888; font-size: 0.85rem; margin-bottom: 24px; }
    .source-block { margin-bottom: 24px; page-break-inside: avoid; }
    .source-name { font-weight: bold; font-size: 1.1rem; padding-bottom: 4px; margin-bottom: 10px; border-bottom: 2px solid currentColor; }
    .article-item { margin-bottom: 10px; padding-left: 10px; border-left: 3px solid #ddd; }
    .article-item a { color: #1a0dab; font-size: 0.95rem; }
    .article-desc { color: #555; font-size: 0.85rem; margin-top: 2px; }
    @media print { body { margin: 20px; } }
  </style></head><body>
  <h1>📰 Arian's News Agent — Report</h1>
  <div class="meta">Topic: <strong>${query}</strong> &nbsp;|&nbsp; Generated: ${generated}</div>`;

  srcOrder.forEach(src => {
    const arts = bySource[src] || [];
    html += `<div class="source-block">
      <div class="source-name" style="color:${srcColors[src]}">${srcNames[src]} says:</div>`;
    if (arts.length) {
      arts.slice(0,5).forEach(a => {
        html += `<div class="article-item">
          <div><a href="${a.url}">${a.title}</a></div>
          ${a.description ? `<div class="article-desc">${a.description.slice(0,150)}…</div>` : ''}
        </div>`;
      });
    } else {
      html += `<div style="color:#aaa">No articles found.</div>`;
    }
    html += `</div>`;
  });

  html += `</body></html>`;
  printWin.document.write(html);
  printWin.document.close();
  printWin.onload = () => { printWin.print(); };
}

function downloadDOC() {
  const content = buildDocContent();
  const blob = new Blob(['\ufeff', content], { type: 'application/msword' });
  triggerDownload(blob, 'news_report.doc');
}

function triggerDownload(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

// Default dates
(function() {
  const today = new Date();
  const weekAgo = new Date(); weekAgo.setDate(today.getDate() - 7);
  const fmt = d => d.toISOString().split('T')[0];
  document.getElementById('dateFrom').value = fmt(weekAgo);
  document.getElementById('dateTo').value = fmt(today);
})();
</script>
</body>
</html>
